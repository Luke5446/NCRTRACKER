<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tibard NCR Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Brand colours, taken from the fabric swatch in the Tibard logo */
  --ink:#1F3864;         /* Tibard navy — same navy as the sheet dashboard */
  --chambray:#2E6DA4;    /* swatch blue */
  --sky:#7FA9CE;         /* swatch light blue */
  --brand-green:#2F7A44; /* swatch green */
  --brand-red:#C1352C;   /* swatch red */
  --paper:#F4F6F9;       /* cool paper background */
  --card:#FFFFFF;
  --line:#DCE3EC;
  --muted:#5C6B7F;
  --open:#D9822B;        /* amber — open */
  --prog:#2E6DA4;        /* blue — in progress */
  --closed:#2F7A44;      /* green — closed */
  --flag:#C1352C;        /* red — not actioned */
  --tagbg:#EDF2F8;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
a{color:var(--chambray)}
:focus-visible{outline:3px solid var(--chambray);outline-offset:2px;border-radius:4px}

/* ---------- header ---------- */
header{background:var(--card);color:var(--ink);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:38px;width:auto;display:block}
/* shown only if the logo file is missing, so the header is never blank */
.wordmark{font-family:'Archivo',sans-serif;font-weight:800;font-size:1.2rem;letter-spacing:.14em;text-transform:uppercase}
.brand .sub{font-family:'Archivo',sans-serif;font-weight:700;font-size:.82rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);border-left:1px solid var(--line);padding-left:14px}
.head-meta{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:.8rem;color:var(--muted)}
.refresh-btn{border:1px solid var(--line);color:var(--ink);padding:6px 13px;border-radius:6px;font-size:.8rem;font-weight:600;background:var(--card)}
.refresh-btn:hover{background:var(--tagbg);border-color:var(--chambray)}

/* brand stripe — the colours of the swatch in the logo */
.seam{height:4px;margin:0;background:linear-gradient(to right,
  var(--brand-green) 0 25%, var(--brand-red) 25% 50%, var(--ink) 50% 75%, var(--sky) 75% 100%)}

main{max-width:1060px;margin:0 auto;padding:22px 18px 60px}

/* ---------- states ---------- */
.state{padding:60px 20px;text-align:center;color:var(--muted);font-size:.95rem}
.state strong{display:block;color:var(--ink);font-family:'Archivo',sans-serif;font-size:1.05rem;margin-bottom:8px}
.state code{background:#E6EAEF;padding:2px 6px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:.85em}

/* ---------- overview ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--chambray);border-radius:10px;padding:13px 16px;text-align:left;width:100%}
.kpi .num{font-family:'Archivo',sans-serif;font-weight:800;font-size:1.9rem;line-height:1.1}
.kpi .lbl{font-size:.74rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.kpi.flagged{border:1px solid #E7B3AE;border-top:3px solid var(--flag);background:#FDF4F3}
.kpi.flagged .num,.kpi.flagged .lbl{color:var(--flag)}
/* tiles you can open for a department breakdown */
.kpi-btn{cursor:pointer;transition:transform .12s ease, box-shadow .12s ease}
.kpi-btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(31,56,100,.10)}
.kpi-btn .lbl::after{content:" \25BE";font-size:.9em}
.kpi-btn.on{box-shadow:0 6px 16px rgba(31,56,100,.14)}
.kpi-btn.on .lbl::after{content:" \25B4"}

/* department breakdown opened from a tile */
.breakdown{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:26px}
.breakdown h3{font-family:'Archivo',sans-serif;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;color:var(--ink)}
.breakdown table{width:100%;border-collapse:collapse;font-size:.9rem}
.breakdown th,.breakdown td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
.breakdown th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.breakdown td:last-child,.breakdown th:last-child{text-align:right;font-variant-numeric:tabular-nums}
.breakdown tr.total td{font-weight:800;border-bottom:none;border-top:2px solid var(--ink)}
.breakdown .none{font-size:.88rem;color:var(--muted)}

.section-title{font-family:'Archivo',sans-serif;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink);margin:0 0 12px}

.dept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
/* department card styled as a garment swing-tag: punched hole + stitched top seam */
.dept-card{position:relative;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--chambray);border-radius:10px;padding:16px 16px 14px;text-align:left;width:100%;transition:transform .12s ease, box-shadow .12s ease}
.dept-card::before{content:"";position:absolute;top:10px;right:12px;width:10px;height:10px;border:2px solid var(--line);border-radius:50%;background:var(--paper)}
.dept-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(31,56,100,.12)}
.dept-name{font-family:'Archivo',sans-serif;font-weight:700;font-size:1.02rem;padding-right:22px;color:var(--ink)}
.dept-owner{font-size:.76rem;color:var(--muted);margin:2px 0 12px}
.dept-stats{display:flex;gap:16px;align-items:baseline}
.dept-stats .big{font-family:'Archivo',sans-serif;font-weight:800;font-size:1.7rem}
.dept-stats .small{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.badge-stale{display:inline-block;margin-top:10px;background:#FBEAE8;color:var(--flag);border:1px solid #E9BDB8;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px}
.badge-clear{display:inline-block;margin-top:10px;color:var(--closed);font-size:.75rem;font-weight:600}

/* ---------- department view ---------- */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.85rem;color:var(--chambray);margin-bottom:14px}
.dept-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.dept-head h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:1.5rem;color:var(--ink)}
.dept-head .owner{color:var(--muted);font-size:.85rem}

.searchbar{display:flex;gap:10px;margin:18px 0 14px;flex-wrap:wrap;align-items:center}
.main-search{margin:0 0 16px}
.main-search input{font-size:1rem;padding:13px 16px}
.dept-tag{background:var(--tagbg);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-weight:600;color:var(--ink)}
.searchbar input{flex:1;min-width:220px;padding:11px 14px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:.95rem;background:var(--card)}
.searchbar input::placeholder{color:#98A2AD}
.toggle{font-size:.8rem;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;user-select:none;cursor:pointer}
.toggle input{accent-color:var(--chambray);width:16px;height:16px;cursor:pointer}

/* ---------- NCR list ---------- */
.ncr-list{display:flex;flex-direction:column;gap:10px}
.ncr{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:start}
.ncr.stale{border-left:4px solid var(--flag)}
.ncr{border-left:4px solid transparent}
.ref-chip{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:.82rem;background:var(--tagbg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;white-space:nowrap}
.ncr-mid{min-width:0}
.ncr-what{font-size:.9rem;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ncr-meta{margin-top:5px;font-size:.75rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.ncr-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{font-size:.71rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.open{background:#FBF0E2;color:#9A5A17;border:1px solid #EBCDA5}
.pill.prog{background:#E8EEF4;color:var(--prog);border:1px solid #C4D2DE}
.pill.closed{background:#E8F1EA;color:var(--closed);border:1px solid #C0D8C6}
.pill.stale{background:#FBEAE8;color:var(--flag);border:1px solid #E9BDB8}
.sev{font-size:.72rem;font-weight:600;color:var(--muted)}
.sev::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--muted)}
.sev.Critical::before{background:var(--flag)} .sev.Critical{color:var(--flag)}
.sev.Major::before{background:var(--open)}
.sev.Minor::before{background:var(--closed)}
.count-line{font-size:.8rem;color:var(--muted);margin:2px 0 12px}

footer{max-width:1060px;margin:0 auto;padding:0 18px 30px;font-size:.72rem;color:#98A2AD}


/* ---------- detail / complete panel ---------- */
.detail-rows{background:var(--tagbg);border:1px solid var(--line);border-left:3px solid var(--chambray);border-radius:8px;padding:11px 13px;margin:10px 0 16px;display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:.85rem}
.detail-rows dt{font-weight:800;color:var(--ink);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;padding-top:2px;white-space:nowrap}
.detail-rows dd{margin:0;line-height:1.4;white-space:pre-line}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--flag);background:#FDF3F2}
.field.invalid label{color:var(--flag)}
.req-note{font-size:.75rem;color:var(--muted);margin:2px 0 10px}

/* ---------- photos from the NCR form ---------- */
.photos-block{margin:0 0 16px}
.photos-head{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:10px}
.photo{margin:0;min-width:0}
.photo-frame{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--tagbg);overflow:hidden;min-height:112px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.photo-frame img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.photo-state{font-size:.74rem;color:var(--muted);padding:10px;text-align:center;line-height:1.4}
.photo-state a{font-weight:600;display:inline-block;margin-top:4px}
.photo-cap{font-size:.7rem;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.has-photo{color:var(--chambray);font-weight:600}
.lightbox{position:fixed;inset:0;background:rgba(30,42,58,.88);display:flex;align-items:center;justify-content:center;padding:22px;z-index:70;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.lightbox-close{position:absolute;top:12px;right:16px;color:#fff;font-size:2rem;line-height:1;padding:2px 10px}
.overlay{position:fixed;inset:0;background:rgba(30,42,58,.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;z-index:50;overflow-y:auto}
.panel{background:var(--card);border-radius:12px;max-width:640px;width:100%;padding:20px 22px;box-shadow:0 18px 50px rgba(30,42,58,.3)}
.panel-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.panel-top .ref-chip{font-size:.95rem}
.panel{border-top:4px solid var(--chambray)}
.panel-close{margin-left:auto;font-size:1.5rem;line-height:1;color:var(--muted);padding:4px 8px}
.panel-what{font-size:.95rem;line-height:1.5;margin:6px 0 4px;white-space:pre-line;font-weight:700}
.panel-meta{font-size:.78rem;color:var(--muted);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:4px 14px}
.raised-by{font-weight:600;word-break:break-all}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field.wide{grid-column:1 / -1}
.field label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;font-size:.9rem;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:#FBFCFD;width:100%}
.field textarea{resize:vertical;min-height:64px}
.panel-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;align-items:center}
.btn{font-weight:700;font-size:.88rem;padding:10px 18px;border-radius:8px}
.btn-save{background:var(--ink);color:#fff}
.btn-save:disabled{opacity:.55;cursor:default}
.btn-cancel{color:var(--muted)}
.save-msg{font-size:.8rem;font-weight:600;margin-right:auto}
.save-msg.ok{color:var(--closed)}
.save-msg.err{color:var(--flag)}
.draft-note{background:#FBF0E2;border:1px solid #EBCDA5;border-radius:7px;padding:9px 12px;
  margin-top:14px;font-size:.82rem;color:#7A4A12;line-height:1.5}
.draft-note button{font-size:.82rem;font-weight:700;color:#7A4A12;text-decoration:underline}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:.85rem;font-weight:600;padding:11px 18px;border-radius:8px;box-shadow:0 8px 24px rgba(30,42,58,.35);z-index:60}
@media (max-width:560px){ .form-grid{grid-template-columns:1fr} }


/* ---------- monthly meeting reports ---------- */
.meeting{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);
  border:1px solid var(--line);border-left:3px solid var(--chambray);border-radius:10px;
  padding:12px 14px;margin-bottom:16px}
.meeting-label{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink)}
.meeting select{font:inherit;font-size:.88rem;padding:8px 10px;border:1px solid var(--line);
  border-radius:7px;background:#FBFCFD;color:var(--ink)}
.btn-report{font-size:.85rem;font-weight:700;padding:8px 14px;border-radius:7px;
  border:1px solid var(--chambray);color:var(--chambray);background:var(--card)}
.btn-report:hover{background:var(--tagbg)}
.btn-report.solid{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-report.solid:hover{background:#16294d}

/* the report itself — styled for paper, shown on screen first so it can be checked */
.report-view{position:fixed;inset:0;background:var(--paper);z-index:80;overflow-y:auto}
.report-bar{position:sticky;top:0;background:var(--ink);color:#fff;padding:11px 18px;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:2}
.report-bar .title{font-family:'Archivo',sans-serif;font-weight:700;font-size:.9rem}
.report-bar .spacer{margin-left:auto}
.report-bar button{border:1px solid #46586E;color:#DCE5EE;padding:7px 14px;border-radius:6px;
  font-size:.83rem;font-weight:600}
.report-bar button.go{background:#fff;color:var(--ink);border-color:#fff}
.rp{max-width:820px;margin:20px auto 60px;background:#fff;color:#111;padding:34px 38px;
  box-shadow:0 6px 26px rgba(31,56,100,.14)}
.rp-head{display:flex;align-items:flex-start;gap:18px;border-bottom:2px solid #1F3864;padding-bottom:14px}
.rp-head img{height:34px;width:auto}
.rp-head .who{margin-left:auto;text-align:right;font-size:.76rem;color:#555;line-height:1.5}
.rp-title{font-family:'Archivo',sans-serif;font-weight:800;font-size:1.5rem;color:#1F3864;line-height:1.15}
.rp-sub{font-size:.86rem;color:#444;margin-top:3px}
.rp h2{font-family:'Archivo',sans-serif;font-size:.78rem;font-weight:800;text-transform:uppercase;
  letter-spacing:.09em;color:#1F3864;margin:26px 0 10px;padding-bottom:5px;border-bottom:1px solid #CBD5E1}
.rp-nums{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:18px}
.rp-num{border:1px solid #CBD5E1;border-radius:6px;padding:10px 11px}
.rp-num b{display:block;font-family:'Archivo',sans-serif;font-size:1.6rem;font-weight:800;line-height:1.1;color:#1F3864}
.rp-num span{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:#555;font-weight:700}
.rp-num.warn{border-color:#C1352C} .rp-num.warn b{color:#C1352C} .rp-num.warn span{color:#C1352C}
.rp table{width:100%;border-collapse:collapse;font-size:.85rem}
.rp th{text-align:left;font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:#555;
  border-bottom:1px solid #CBD5E1;padding:5px 7px 5px 0}
.rp td{padding:6px 7px 6px 0;border-bottom:1px solid #E6EBF1;vertical-align:top}
.rp td.n,.rp th.n{width:46px;font-variant-numeric:tabular-nums;font-weight:700;color:#1F3864}
.rp td.ref{white-space:nowrap;font-family:'IBM Plex Mono',monospace;font-size:.8rem;font-weight:600}
.rp-flag{border-left:3px solid #C1352C;padding:8px 0 8px 12px;margin-bottom:10px;font-size:.87rem}
.rp-flag b{font-family:'IBM Plex Mono',monospace;font-size:.82rem}
.rp-flag .why{color:#C1352C;font-weight:700;font-size:.76rem;text-transform:uppercase;letter-spacing:.04em}
.rp-none{font-size:.87rem;color:#555;font-style:italic}
.rp-foot{margin-top:28px;padding-top:12px;border-top:1px solid #CBD5E1;font-size:.72rem;color:#666}

/* one NCR per printed page */
.rp-case{padding-bottom:8px}
.rp-case+.rp-case{border-top:2px solid #1F3864;margin-top:34px;padding-top:22px}
.rp-case-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rp-case-top .r{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:1.05rem;color:#1F3864}
.rp-case-top .s{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  border:1px solid #99A7BA;border-radius:999px;padding:2px 9px;color:#333}
.rp-what{font-size:1rem;font-weight:700;margin:9px 0 12px;line-height:1.4;white-space:pre-line}
.rp-grid{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:.85rem;margin-bottom:6px}
.rp-grid dt{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#555;
  padding-top:2px;white-space:nowrap}
.rp-grid dd{margin:0;white-space:pre-line}
.rp-notes{margin-top:14px}
.rp-notes .lbl{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#555}
.rp-notes .lines{margin-top:5px}
.rp-notes .lines i{display:block;border-bottom:1px solid #C9D3DF;height:20px}

.rp-warn{max-width:820px;margin:16px auto -6px;background:#FDF4F3;border:1px solid #E7B3AE;
  border-left:3px solid var(--flag);border-radius:8px;padding:12px 16px;font-size:.86rem;color:var(--ink)}
.rp-warn b{color:var(--flag)}
.rp-ext+.rp-ext{margin-top:26px}
.rp-to{margin-top:20px;padding:12px 0 10px;border-bottom:1px solid #CBD5E1}
.rp-to .lbl{display:block;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#555}
.rp-to b{font-family:'Archivo',sans-serif;font-size:1.2rem;color:#1F3864}
.rp-lead{font-size:.88rem;line-height:1.6;margin-top:14px;max-width:64ch}
.rp-nums-3{grid-template-columns:repeat(3,1fr)}
.rp-contact{margin-top:22px;border:1px solid #CBD5E1;border-radius:6px;padding:12px 14px;font-size:.86rem;line-height:1.6}
.rp-contact b{color:#1F3864}
.rp-contact .mono{font-family:'IBM Plex Mono',monospace;font-size:.84rem}

@media (max-width:620px){ .rp{padding:22px 18px;margin:12px} .rp-nums{grid-template-columns:repeat(2,1fr)} }

@media print{
  header,.seam,footer,main,.overlay,.toast,.report-bar,.rp-warn{display:none !important}
  body{background:#fff}
  .report-view{position:static;overflow:visible;background:#fff}
  .rp{max-width:none;margin:0;padding:0;box-shadow:none}
  .rp-case{page-break-inside:avoid}
  .rp-case+.rp-case{page-break-before:always;border-top:none;margin-top:0;padding-top:0}
  .rp-ext+.rp-ext{page-break-before:always;margin-top:0}
  .rp h2{page-break-after:avoid}
  tr{page-break-inside:avoid}
  a{text-decoration:none;color:#111}
}
@page{margin:14mm}

@media (max-width:560px){
  header{padding:10px 14px;gap:10px}
  .brand img{height:30px}
  .brand .sub{font-size:.7rem;padding-left:10px;letter-spacing:.06em;white-space:nowrap}
  .ncr{grid-template-columns:1fr}
  .ncr-side{flex-direction:row;align-items:center;justify-content:flex-start}
  .head-meta{width:100%;margin-left:0}
}
@media (prefers-reduced-motion: reduce){
  .dept-card{transition:none}
  .dept-card:hover{transform:none}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="tibard-logo.jpg" alt="Tibard" onerror="this.outerHTML='&lt;span class=&quot;wordmark&quot;&gt;Tibard&lt;/span&gt;'">
    <span class="sub">NCR Dashboard</span>
  </div>
  <div class="head-meta">
    <span id="updated"></span>
    <button class="refresh-btn" id="refreshBtn" type="button">Refresh</button>
  </div>
</header>
<div class="seam"></div>

<main id="app">
  <div class="state"><strong>Loading the register&hellip;</strong>Fetching live NCRs from the Google Sheet.</div>
</main>

<footer>Live from the NCR register. Tap any NCR to see the full report and complete it &mdash; everything saves straight back to the register.</footer>

<script>
/* ================= CONFIG ================= */
const API_URL = "https://script.google.com/macros/s/AKfycbyfpl9AnvGr5zv-Vimh04no7LhYD2RV6ZZMlyan2BQhWPHLqKZlbjDB0x0y-Y9qLfw5/exec";
const APP_KEY = "tibard-ncr-2026";   // must match APP_KEY in the Apps Script
const STALE_DAYS = 7;                    // flag if still "Open" after this many days
const REPORT_CONTACT = "NCR@tibard.co.uk";   // shown on reports that go outside the company
const NEW_WINDOW_DAYS = 7;               // "new" = raised in the last 7 days
/* A department can be owned by more than one person — list them in an array. */
const OWNERS = {
  "Sales":"Duncan", "Suppliers":"Duncan", "IT & Digital":"Ben",
  "Production":"Gail", "EMB":"Sharon", "Stores":"Ste",
  "Accounts":"Vanessa", "ISO/QC":"Yvonne", "Other":"Luke H",
  "Procurement": ["Duncan", "Ben", "Luke H"],
  "Logistics":   ["Duncan", "Ste", "Luke H"]
};
function ownersOf(g){ const o = OWNERS[g]; return Array.isArray(o) ? o : (o ? [o] : []); }
function ownerText(g){ return ownersOf(g).join(', '); }
function ownerWord(g){ return ownersOf(g).length > 1 ? 'Owners' : 'Owner'; }

/* Our regular suppliers. Anything typed into Customer/Supplier that is a near
   miss for one of these — a different case, a missing space, a trailing account
   number, a slip of the fingers — is treated as that supplier, so each gets one
   page in the report rather than one page per spelling.
   ADD NEW SUPPLIERS HERE, spelled the way you want them to appear on a report
   that goes out to them. */
const SUPPLIERS = [
  "Ralawise", "Clockwork", "PenCarrie", "Tiajo",
  "Carrington", "Brook Taverner", "NewLace"
];

/* Departments whose NCRs are raised against an outside company, so their
   monthly report is worth producing one company at a time. */
const EXTERNAL_DEPTS = ["Suppliers", "Logistics"];
/* Carriers are reviewed together as Logistics. The register still records which
   one it was in column C — this only groups them for the managers' view. */
const LOGISTICS = ["DPD", "H&B", "Logistics"];
function groupDept(d){
  const t = String(d || '').trim();
  return LOGISTICS.indexOf(t) > -1 ? "Logistics" : (t || "Other");
}
/* Staff read "Open" as "someone is on it", so the app says Outstanding.
   The value written to the register is still "Open" — this is wording only. */
const STATUS_LABEL = { "Open": "Outstanding" };
function statusLabel(v){ return STATUS_LABEL[v] || v; }
/* ========================================== */

let DATA = null;
let view = { dept: null, search: "", showClosed: false, metric: null, q: "", month: "" };

const $app = document.getElementById('app');
const $updated = document.getElementById('updated');
document.getElementById('refreshBtn').addEventListener('click', () => load(true));

function daysSince(iso){
  const t = new Date(iso); if (isNaN(t)) return 0;
  return Math.floor((Date.now() - t.getTime()) / 86400000);
}
function isLive(r){ return r.status === "Open" || r.status === "In Progress"; }
function isStale(r){ return r.status === "Open" && daysSince(r.ts) > STALE_DAYS; }
function isLate(r){
  if (r.status === 'Closed' || !r.target) return false;
  const t = new Date(r.target);
  if (isNaN(t)) return false;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return t < today;
}
function daysLate(r){
  const t = new Date(r.target);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.floor((today - t) / 86400000);
}
function isNew(r){ return daysSince(r.ts) <= NEW_WINDOW_DAYS; }
/* offset 0 = this calendar month, -1 = last calendar month */
function monthStart(offset){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth() + offset, 1); }
function inMonth(r, offset){
  const t = new Date(r.ts); if (isNaN(t)) return false;
  const m = monthStart(offset);
  return t.getFullYear() === m.getFullYear() && t.getMonth() === m.getMonth();
}
function monthName(offset){ return monthStart(offset).toLocaleDateString('en-GB', { month:'long' }); }
/* "2026-7" style keys, so a month can be picked and compared without timezone grief */
function monthKeyOf(iso){ const t = new Date(iso); return isNaN(t) ? '' : t.getFullYear() + '-' + t.getMonth(); }
function monthLabelOf(key){
  const p = key.split('-');
  return new Date(+p[0], +p[1], 1).toLocaleDateString('en-GB', { month:'long', year:'numeric' });
}
function monthsPresent(rs){
  const seen = {};
  rs.forEach(r => { const k = monthKeyOf(r.ts); if (k) seen[k] = true; });
  return Object.keys(seen).sort((a,b) => {
    const x = a.split('-').map(Number), y = b.split('-').map(Number);
    return y[0] - x[0] || y[1] - x[1];          /* newest first */
  });
}
function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
function fmtDate(iso){
  const t = new Date(iso); if (isNaN(t)) return "";
  return t.toLocaleDateString('en-GB', { day:'numeric', month:'short' });
}
function fetchRegister(){
  return fetch(API_URL + (API_URL.includes('?') ? '&' : '?') + 't' + '=' + Date.now())
    .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); });
}

async function load(manual){
  if (manual) $app.innerHTML = '<div class="state"><strong>Refreshing&hellip;</strong></div>';
  if (API_URL.indexOf('PASTE_') === 0){
    $app.innerHTML = '<div class="state"><strong>Not connected yet</strong>Open this file and paste your Apps Script Web App URL into <code>API_URL</code> at the top of the script section.</div>';
    return;
  }
  try {
    DATA = await fetchRegister();
    $updated.textContent = 'Updated ' + new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
    render();
  } catch (err){
    /* A blip on the five-minute refresh must not take the page away from
       somebody mid-sentence. Only wipe the screen if there is nothing to keep. */
    if (DATA && !manual){
      $updated.textContent = 'Couldn\u2019t refresh \u2014 showing the last copy';
      return;
    }
    $app.innerHTML = '<div class="state"><strong>Couldn\'t reach the register</strong>' +
      'Check you\'re online, then press Refresh. If it keeps failing, the Apps Script deployment may need redeploying.<br><br><code>' + esc(err.message) + '</code></div>';
  }
}

/* One quiet retry before the five-minute refresh gives up, since most of these
   are a moment's blip rather than anything being wrong. */
async function backgroundRefresh(){
  if (!DATA) return;
  if (document.querySelector('.overlay')) return;   /* somebody is mid-edit — leave them alone */
  try {
    DATA = await fetchRegister();
  } catch (err){
    try { DATA = await fetchRegister(); }
    catch (err2){ $updated.textContent = 'Couldn\u2019t refresh \u2014 showing the last copy'; return; }
  }
  $updated.textContent = 'Updated ' + new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
  render();
}

function render(){ view.dept ? renderDept() : renderOverview(); }

/* ---------------- overview ---------------- */
/* The four headline tiles. Tap one to see the same figure split by department. */
function metrics(){
  return {
    last: { label: 'NCRs in ' + monthName(-1), test: r => inMonth(r, -1) },
    this: { label: 'NCRs in ' + monthName(0),  test: r => inMonth(r, 0) },
    late: { label: 'Late', title: 'Late (past target date)', test: isLate, flag: true },
    stale:{ label: 'Not actioned in ' + STALE_DAYS + ' days', test: isStale, flag: true }
  };
}

function renderOverview(){
  $app.innerHTML =
    '<div class="searchbar main-search">' +
      '<input type="search" id="mainQ" autocomplete="off" value="' + esc(view.q) + '" ' +
        'placeholder="Search every NCR &mdash; number, order, customer or keyword&hellip;">' +
    '</div>' +
    '<div id="mainBody"></div>';

  const box = document.getElementById('mainQ');
  box.addEventListener('input', () => { view.q = box.value; renderMainBody(); });
  renderMainBody();
}

/* Either the search results, or the tiles and departments. */
function renderMainBody(){
  const wrap = document.getElementById('mainBody');
  if (!wrap) return;
  if (view.q.trim()){ renderSearch(wrap, view.q.trim()); return; }

  const rows = DATA.rows;
  const M = metrics();

  const groups = {};
  rows.forEach(r => {
    const g = groupDept(r.dept);
    (groups[g] = groups[g] || []).push(r);
  });

  /* alphabetical, so people can find their own department at a glance */
  const order = Object.keys(groups).sort((a,b) => a.localeCompare(b));

  let html =
    '<div class="kpis">' +
      Object.keys(M).map(k => {
        const m = M[k];
        return '<button type="button" class="kpi kpi-btn' + (m.flag ? ' flagged' : '') +
          (view.metric === k ? ' on' : '') + '" data-metric="' + k + '">' +
          '<div class="num">' + rows.filter(m.test).length + '</div>' +
          '<div class="lbl">' + esc(m.label) + '</div></button>';
      }).join('') +
    '</div>' +
    '<div id="breakdown"></div>' +
    '<h2 class="section-title">Departments &mdash; tap yours</h2>' +
    '<div class="dept-grid">';

  order.forEach(g => {
    const rs = groups[g];
    const nOpen = rs.filter(isLive).length;
    const nNew = rs.filter(isNew).length;
    const nStale = rs.filter(isStale).length;
    html +=
      '<button class="dept-card" type="button" data-dept="' + esc(g) + '">' +
        '<div class="dept-name">' + esc(g) + '</div>' +
        '<div class="dept-owner">' + esc(ownerText(g)) + '</div>' +
        '<div class="dept-stats">' +
          '<span><span class="big">' + nNew + '</span> <span class="small">new</span></span>' +
          '<span><span class="big">' + nOpen + '</span> <span class="small">outstanding</span></span>' +
        '</div>' +
        (nStale > 0
          ? '<span class="badge-stale">' + nStale + ' not actioned in ' + STALE_DAYS + '+ days</span>'
          : '<span class="badge-clear">All actioned &#10003;</span>') +
      '</button>';
  });

  html += '</div>';
  wrap.innerHTML = html;
  wrap.querySelectorAll('.dept-card').forEach(b =>
    b.addEventListener('click', () => { view = { dept: b.dataset.dept, search: "", showClosed: false, metric: null, q: "" }; render(); window.scrollTo(0,0); }));
  wrap.querySelectorAll('.kpi-btn').forEach(b =>
    b.addEventListener('click', () => {
      view.metric = (view.metric === b.dataset.metric) ? null : b.dataset.metric;
      renderMainBody();
    }));
  renderBreakdown();
}

/* Front-page search: every NCR in the register, closed ones included, so a
   number can be looked up without knowing whose department it belongs to. */
function renderSearch(wrap, term){
  const t = term.toLowerCase();
  const hit = v => String(v || '').toLowerCase().includes(t);
  const list = DATA.rows.filter(r => hit(r.ref) || hit(r.order) || hit(r.cust) || hit(r.dept) || hit(r.what));

  /* a matching NCR number is almost always what was wanted, so float those up */
  list.sort((a,b) => {
    const rank = r => hit(r.ref) ? 0 : 1;
    return rank(a) - rank(b) || (a.ts < b.ts ? 1 : -1);
  });

  if (!list.length){
    wrap.innerHTML = '<div class="state"><strong>No NCRs match &ldquo;' + esc(term) + '&rdquo;</strong>' +
      'Try just the number, e.g. <code>176</code>, or an order number.</div>';
    return;
  }

  wrap.innerHTML =
    '<p class="count-line">' + list.length + ' NCR' + (list.length === 1 ? '' : 's') +
      ' found &mdash; all departments, including closed</p>' +
    '<div class="ncr-list">' + list.map(r => card(r, true)).join('') + '</div>';
  attachCardClicks();
}

/* The department split behind whichever tile is open. */
function renderBreakdown(){
  const wrap = document.getElementById('breakdown');
  if (!wrap) return;
  const m = metrics()[view.metric];
  if (!m){ wrap.innerHTML = ''; return; }

  const matching = DATA.rows.filter(m.test);
  const counts = {};
  matching.forEach(r => { const g = groupDept(r.dept); counts[g] = (counts[g] || 0) + 1; });
  const order = Object.keys(counts).sort((a,b) => counts[b] - counts[a] || (a < b ? -1 : 1));

  wrap.innerHTML = '<div class="breakdown"><h3>' + esc(m.title || m.label) + ' &mdash; by department</h3>' +
    (order.length
      ? '<table><thead><tr><th>Department</th><th>NCRs</th></tr></thead><tbody>' +
        order.map(g => '<tr><td>' + esc(g) + '</td><td>' + counts[g] + '</td></tr>').join('') +
        '<tr class="total"><td>Total</td><td>' + matching.length + '</td></tr>' +
        '</tbody></table>'
      : '<p class="none">Nothing to show.</p>') +
    '</div>';
}

function kpi(n, label, flagged){
  return '<div class="kpi' + (flagged ? ' flagged' : '') + '"><div class="num">' + n + '</div><div class="lbl">' + label + '</div></div>';
}

/* ---------------- department view ---------------- */
function renderDept(){
  const g = view.dept;
  const rs = DATA.rows.filter(r => groupDept(r.dept) === g);
  const live = rs.filter(isLive);
  const late = rs.filter(isLate);
  const openOnly = rs.filter(r => r.status === 'Open');
  const slow = rs.filter(isStale);

  let html =
    '<button class="back" type="button" id="backBtn">&larr; All departments</button>' +
    '<div class="dept-head"><h1>' + esc(g) + '</h1><span class="owner">' + ownerWord(g) + ': ' +
      (ownerText(g) ? esc(ownerText(g)) : '&mdash;') + '</span></div>' +
    '<div class="kpis">' +
      kpi(openOnly.length, 'Outstanding') +
      kpi(slow.length, 'Not actioned in ' + STALE_DAYS + ' days', true) +
      kpi(late.length, 'Late', true) +
    '</div>' +
    meetingBar(rs, g) +
    '<div class="searchbar">' +
      '<input type="search" id="q" placeholder="Search by NCR number, order, customer or keyword&hellip;" value="' + esc(view.search) + '" autocomplete="off">' +
      '<label class="toggle"><input type="checkbox" id="showClosed"' + (view.showClosed ? ' checked' : '') + '> Show closed</label>' +
    '</div>' +
    '<div id="listWrap"></div>';

  $app.innerHTML = html;
  document.getElementById('backBtn').addEventListener('click', () => { view.dept = null; view.metric = null; render(); });
  const q = document.getElementById('q');
  q.addEventListener('input', () => { view.search = q.value; renderList(rs); });
  document.getElementById('showClosed').addEventListener('change', e => { view.showClosed = e.target.checked; renderList(rs); });
  wireMeetingBar(g, rs);
  renderList(rs);
}

/* ---------------- monthly meeting reports ---------------- */
function meetingBar(rs, g){
  const months = monthsPresent(rs);
  if (!months.length) return '';
  const now = monthKeyOf(new Date().toISOString());
  const pick = months.indexOf(view.month) > -1 ? view.month
             : (months.indexOf(now) > -1 ? now : months[0]);
  view.month = pick;
  return '<div class="meeting">' +
      '<span class="meeting-label">Monthly meeting</span>' +
      '<select id="reportMonth" aria-label="Month">' +
        months.map(k => '<option value="' + k + '"' + (k === pick ? ' selected' : '') + '>' +
          esc(monthLabelOf(k)) + '</option>').join('') +
      '</select>' +
      '<button class="btn-report solid" type="button" id="btnSummary">Monthly summary</button>' +
      '<button class="btn-report" type="button" id="btnCases">Print each NCR</button>' +
      (EXTERNAL_DEPTS.indexOf(g) > -1
        ? '<button class="btn-report" type="button" id="btnSuppliers">Report per company</button>' : '') +
    '</div>';
}

function wireMeetingBar(g, rs){
  const sel = document.getElementById('reportMonth');
  if (!sel) return;
  sel.addEventListener('change', () => { view.month = sel.value; });
  const forMonth = () => rs.filter(r => monthKeyOf(r.ts) === view.month)
                          .sort((a,b) => (a.ts < b.ts ? -1 : 1));
  document.getElementById('btnSummary').addEventListener('click', () =>
    openReport('Monthly summary', summaryDoc(g, forMonth(), view.month)));
  document.getElementById('btnCases').addEventListener('click', () =>
    openReport('NCR case pack', casesDoc(g, forMonth(), view.month)));
  const sup = document.getElementById('btnSuppliers');
  if (sup) sup.addEventListener('click', () =>
    openReport('Report per company', supplierDoc(g, forMonth(), view.month), true));
}

function openReport(title, docHtml, outgoing){
  const v = document.createElement('div');
  v.className = 'report-view';
  v.innerHTML =
    '<div class="report-bar">' +
      '<button type="button" id="rpBack">&larr; Back</button>' +
      '<span class="title">' + esc(title) + '</span>' +
      '<span class="spacer"></span>' +
      '<button type="button" class="go" id="rpPrint">Print</button>' +
    '</div>' +
    (outgoing
      ? '<div class="rp-warn"><b>Read this before you send it.</b> The descriptions are whatever staff ' +
        'typed when they raised the NCR, and were written for us rather than for the company receiving it. ' +
        'One page per company &mdash; print the lot, or use your printer\u2019s page range to send just one.</div>'
      : '') + docHtml;
  document.body.appendChild(v);
  window.scrollTo(0, 0);
  const shut = () => { v.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') shut(); };
  v.querySelector('#rpBack').addEventListener('click', shut);
  v.querySelector('#rpPrint').addEventListener('click', () => window.print());
  document.addEventListener('keydown', onKey);
}

function reportHead(g, monthKey, title){
  return '<div class="rp-head">' +
      '<img src="tibard-logo.jpg" alt="Tibard" onerror="this.remove()">' +
      '<div><div class="rp-title">' + esc(title) + '</div>' +
        '<div class="rp-sub">' + esc(g) + ' &middot; ' + esc(monthLabelOf(monthKey)) + '</div></div>' +
      '<div class="who">' + ownerWord(g) + ': ' + esc(ownerText(g) || '\u2014') + '<br>' +
        'Printed ' + new Date().toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'}) + '</div>' +
    '</div>';
}

/* ---------------- company names ----------------
   Customer and supplier names are typed by hand, so "Ralawise", "ralawise ",
   "Pen Carrie" and "PenCarrie" all arrive looking like different companies and
   each got its own report. Fold them on a key that ignores case, spacing and
   punctuation, and show whichever spelling the team actually uses most. */
function companyKey(name){ return String(name == null ? '' : name).toLowerCase().replace(/[^a-z0-9]/g, ''); }
function capitalise(name){
  const n = String(name == null ? '' : name).trim();
  return n ? n.charAt(0).toUpperCase() + n.slice(1) : n;
}

/* Snap a typed-in name onto one of our regular suppliers when it is clearly
   meant to be one. Three ways it can match, in order of confidence:
     1. the same once case, spaces and punctuation are ignored  ("brook taverner")
     2. the supplier's name with something tacked on            ("Ralawise - 18499")
     3. close enough to be a slip of the fingers                ("Ralwaise")
   Returns the supplier's proper spelling, or null when it is nobody we know. */
const SUPPLIER_KEYS = SUPPLIERS.map(n => ({ name: n, key: companyKey(n) }));
function canonicalCompany(raw){
  const k = companyKey(raw);
  if (!k) return null;
  let best = null, bestDist = Infinity;
  for (let i = 0; i < SUPPLIER_KEYS.length; i++){
    const s = SUPPLIER_KEYS[i];
    if (k === s.key) return s.name;
    /* an account number or "Ltd" on the end, or a name typed short */
    if (s.key.length >= 5 && (k.indexOf(s.key) === 0 || s.key.indexOf(k) === 0)){
      if (0 < bestDist){ best = s.name; bestDist = 0; }
      continue;
    }
    /* a mistyped name: only worth guessing at when the lengths are close */
    if (Math.abs(k.length - s.key.length) > 2) continue;
    const allowed = s.key.length >= 8 ? 2 : 1;
    const d = editDistance(k, s.key);
    if (d <= allowed && d < bestDist){ best = s.name; bestDist = d; }
  }
  return best;
}
function isKnownSupplier(name){ return SUPPLIERS.indexOf(name) > -1; }

function groupByCompany(rows){
  const buckets = {};
  rows.forEach(r => {
    const raw = String(r.cust || '').trim();
    const known = canonicalCompany(raw);
    const k = known ? companyKey(known) : companyKey(raw);
    if (!k) return;
    const b = buckets[k] = buckets[k] || { rows: [], spellings: {}, known: known };
    b.rows.push(r);
    b.spellings[raw] = (b.spellings[raw] || 0) + 1;
  });
  return Object.keys(buckets).map(k => {
    const b = buckets[k];
    /* a supplier we know is always shown the way we spell it */
    if (b.known){
      const used = Object.keys(b.spellings).sort((a,x) => b.spellings[x] - b.spellings[a]);
      return { key: k, name: b.known, rows: b.rows, spellings: used, known: true };
    }
    /* the spelling used most often wins; a capitalised one breaks a tie, so
       "PenCarrie" survives rather than being flattened to "Pencarrie" */
    const names = Object.keys(b.spellings).sort((a, x) =>
      b.spellings[x] - b.spellings[a] ||
      (/^[A-Z]/.test(x) ? 1 : 0) - (/^[A-Z]/.test(a) ? 1 : 0) ||
      a.localeCompare(x));
    return { key: k, name: capitalise(names[0]), rows: b.rows, spellings: names, known: false };
  });
}

/* Folding case and spacing is safe. Actual typos are not — merging two real
   companies by mistake would be worse than listing them twice — so near
   matches are pointed out on screen and left alone. */
/* Counts a swapped pair of letters as one slip rather than two, because
   "Ralwaise" for "Ralawise" is how people actually mistype. */
function editDistance(a, b){
  const d = [];
  for (let i = 0; i <= a.length; i++){ d[i] = [i]; }
  for (let j = 0; j <= b.length; j++){ d[0][j] = j; }
  for (let i = 1; i <= a.length; i++){
    for (let j = 1; j <= b.length; j++){
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + cost);
      if (i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]){
        d[i][j] = Math.min(d[i][j], d[i-2][j-2] + 1);       /* two letters swapped */
      }
    }
  }
  return d[a.length][b.length];
}
function looksLikeTheSame(a, b){
  const x = companyKey(a), y = companyKey(b);
  if (x.length < 4 || y.length < 4) return false;      /* too short to call */
  if (Math.abs(x.length - y.length) > 2) return false;
  return editDistance(x, y) <= (Math.min(x.length, y.length) >= 8 ? 2 : 1);
}
function nearMatches(names){
  const out = [];
  for (let i = 0; i < names.length; i++)
    for (let j = i + 1; j < names.length; j++){
      /* two suppliers off our own list are different companies by definition */
      if (isKnownSupplier(names[i]) && isKnownSupplier(names[j])) continue;
      if (looksLikeTheSame(names[i], names[j])) out.push(names[i] + ' / ' + names[j]);
    }
  return out;
}

function countBy(list, pick){
  const m = {};
  list.forEach(r => { const k = String(pick(r) || '').trim(); if (k) m[k] = (m[k] || 0) + 1; });
  return Object.keys(m).sort((a,b) => m[b] - m[a] || a.localeCompare(b)).map(k => [k, m[k]]);
}

function summaryDoc(g, list, monthKey){
  const outstanding = list.filter(r => r.status === 'Open');
  const prog = list.filter(r => r.status === 'In Progress');
  const closed = list.filter(r => r.status === 'Closed');
  const stale = list.filter(isStale);
  const cats = countBy(list, r => r.cat);

  /* what a manager should be ready to speak to */
  const severe = list.filter(r => (r.sev === 'Critical' || r.sev === 'Major') && r.status !== 'Closed');
  const repeatCust = groupByCompany(list).filter(c => c.rows.length > 1)
    .sort((a,b) => b.rows.length - a.rows.length || a.name.localeCompare(b.name))
    .map(c => [c.name, c.rows.length]);
  const repeatCause = cats.filter(x => x[1] > 1);
  const flags = [];
  list.filter(isLate).forEach(r => flags.push([r, daysLate(r) + ' days past target']));
  stale.forEach(r => { if (!isLate(r)) flags.push([r, daysSince(r.ts) + ' days, not actioned']); });
  severe.forEach(r => { if (!isStale(r) && !isLate(r)) flags.push([r, r.sev + ', still open']); });

  if (!list.length){
    return '<div class="rp">' + reportHead(g, monthKey, 'NCR monthly summary') +
      '<p class="rp-none" style="margin-top:24px">No NCRs were raised for ' + esc(g) +
      ' in ' + esc(monthLabelOf(monthKey)) + '.</p></div>';
  }

  return '<div class="rp">' + reportHead(g, monthKey, 'NCR monthly summary') +
    '<div class="rp-nums">' +
      '<div class="rp-num"><b>' + list.length + '</b><span>Raised</span></div>' +
      '<div class="rp-num"><b>' + outstanding.length + '</b><span>Outstanding</span></div>' +
      '<div class="rp-num"><b>' + prog.length + '</b><span>In progress</span></div>' +
      '<div class="rp-num"><b>' + closed.length + '</b><span>Closed</span></div>' +
      '<div class="rp-num' + (stale.length ? ' warn' : '') + '"><b>' + stale.length + '</b><span>Not actioned</span></div>' +
    '</div>' +

    '<h2>Why they happened</h2>' +
    (cats.length
      ? '<table><thead><tr><th class="n">No.</th><th>Reason</th></tr></thead><tbody>' +
        cats.map(c => '<tr><td class="n">' + c[1] + '</td><td>' + esc(c[0]) + '</td></tr>').join('') +
        '</tbody></table>'
      : '<p class="rp-none">No issue categories recorded.</p>') +

    '<h2>Worth raising at the meeting</h2>' +
    (flags.length
      ? flags.map(f => '<div class="rp-flag"><span class="why">' + esc(f[1]) + '</span><br>' +
          '<b>' + esc(f[0].ref) + '</b> &mdash; ' + esc(String(f[0].what).slice(0, 180)) + '</div>').join('')
      : '<p class="rp-none">Nothing outstanding beyond ' + STALE_DAYS + ' days, and no critical or major NCRs still open.</p>') +
    (repeatCause.length || repeatCust.length
      ? '<p style="font-size:.85rem;margin-top:10px">' +
          (repeatCause.length ? '<b>Recurring reasons:</b> ' + repeatCause.map(c => esc(c[0]) + ' (' + c[1] + ')').join(', ') + '. ' : '') +
          (repeatCust.length ? '<b>More than once:</b> ' + repeatCust.map(c => esc(c[0]) + ' (' + c[1] + ')').join(', ') + '.' : '') +
        '</p>'
      : '') +

    '<h2>Every NCR this month</h2>' +
    '<table><thead><tr><th>Ref</th><th>Raised</th><th>Status</th><th>Severity</th><th>What happened</th></tr></thead><tbody>' +
      list.map(r => '<tr>' +
        '<td class="ref">' + esc(r.ref || '\u2014') + '</td>' +
        '<td>' + fmtDate(r.ts) + '</td>' +
        '<td>' + esc(statusLabel(r.status)) + '</td>' +
        '<td>' + esc(r.sev || '\u2014') + '</td>' +
        '<td>' + esc(String(r.what).slice(0, 150)) + '</td></tr>').join('') +
    '</tbody></table>' +

    '<div class="rp-foot">Taken from the NCR register on ' +
      new Date().toLocaleString('en-GB', {day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}) +
      '. Figures cover NCRs raised in ' + esc(monthLabelOf(monthKey)) + ' only.</div>' +
  '</div>';
}

/* One page per outside company, written to be sent to them. Deliberately leaves
   out anything internal: who reported it, who owns it, our root-cause analysis,
   and of course any other company's NCRs. */
function supplierDoc(g, list, monthKey){
  const companies = groupByCompany(list)
    .sort((a,b) => b.rows.length - a.rows.length || a.name.localeCompare(b.name));
  const unnamed = list.length - companies.reduce((n,c) => n + c.rows.length, 0);

  /* Say plainly what the app decided: which typed-in names it read as one of
     our suppliers, which it merely tidied, and which it left alone. All three
     are on screen only and never print. */
  const changed = c => c.spellings.length > 1 || c.spellings[0] !== c.name;
  const line = c => c.spellings.join(' / ') + ' \u2192 ' + c.name;
  const matched = companies.filter(c => c.known && changed(c)).map(line);
  const folded  = companies.filter(c => !c.known && changed(c)).map(line);
  const near = nearMatches(companies.map(c => c.name));
  const notes =
    (matched.length ? '<div class="rp-warn"><b>Read as one of your suppliers.</b> These were typed ' +
       'differently and have been put on that supplier\u2019s page: ' + esc(matched.join('; ')) + '.</div>' : '') +
    (folded.length ? '<div class="rp-warn"><b>Spellings joined up.</b> These were recorded more than one ' +
       'way and have been treated as the same company: ' + esc(folded.join('; ')) + '.</div>' : '') +
    (near.length ? '<div class="rp-warn"><b>Worth a look.</b> These are close enough to be the same ' +
       'company but different enough that they have not been joined: ' + esc(near.join('; ')) + '. ' +
       'They each get their own page \u2014 tidy the register, or add the name to the supplier ' +
       'list, if they should be one.</div>' : '');

  if (!companies.length){
    return '<div class="rp">' + reportHead(g, monthKey, 'Supplier quality report') +
      '<p class="rp-none" style="margin-top:24px">No NCRs were recorded against a named company for ' +
      esc(g) + ' in ' + esc(monthLabelOf(monthKey)) + '.</p></div>';
  }

  return notes + companies.map(c => {
    const name = c.name, rs = c.rows;
    const open = rs.filter(r => r.status !== 'Closed');
    const cats = countBy(rs, r => r.cat);
    return '<div class="rp rp-ext">' +
      '<div class="rp-head">' +
        '<img src="tibard-logo.jpg" alt="Tibard" onerror="this.remove()">' +
        '<div><div class="rp-title">Supplier quality report</div>' +
          '<div class="rp-sub">' + esc(monthLabelOf(monthKey)) + '</div></div>' +
        '<div class="who">Issued ' +
          new Date().toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'}) + '</div>' +
      '</div>' +

      '<div class="rp-to"><span class="lbl">Prepared for</span><b>' + esc(name) + '</b></div>' +

      '<p class="rp-lead">This report lists the non-conformances Tibard recorded against ' + esc(name) +
        ' during ' + esc(monthLabelOf(monthKey)) + ', as part of our routine supplier quality monitoring. ' +
        'It is shared so that both sides are working from the same record.</p>' +

      '<div class="rp-nums rp-nums-3">' +
        '<div class="rp-num"><b>' + rs.length + '</b><span>Raised this month</span></div>' +
        '<div class="rp-num"><b>' + open.length + '</b><span>Still open</span></div>' +
        '<div class="rp-num"><b>' + (rs.length - open.length) + '</b><span>Closed</span></div>' +
      '</div>' +

      '<h2>Reasons recorded</h2>' +
      '<table><thead><tr><th class="n">No.</th><th>Reason</th></tr></thead><tbody>' +
        cats.map(c => '<tr><td class="n">' + c[1] + '</td><td>' + esc(c[0]) + '</td></tr>').join('') +
      '</tbody></table>' +

      '<h2>The individual items</h2>' +
      '<table><thead><tr><th>Our ref</th><th>Date</th><th>Order</th><th>What we recorded</th><th>Status</th></tr></thead><tbody>' +
        rs.map(r => '<tr>' +
          '<td class="ref">' + esc(r.ref || '\u2014') + '</td>' +
          '<td>' + fmtDate(r.ts) + '</td>' +
          '<td>' + esc(r.order || '\u2014') + '</td>' +
          '<td>' + esc(String(r.what)) + '</td>' +
          '<td>' + esc(r.status === 'Closed' ? 'Closed' : 'Open') + '</td></tr>').join('') +
      '</tbody></table>' +

      '<div class="rp-contact">' +
        '<b>Any questions on the above?</b><br>' +

        '<span class="mono">' + esc(REPORT_CONTACT) + '</span>' +
      '</div>' +

      '<div class="rp-foot">Tibard Ltd &middot; issued ' +
        new Date().toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'}) +
        '. Covers ' + esc(monthLabelOf(monthKey)) + ' only.</div>' +
    '</div>';
  }).join('') +
  (unnamed
    ? '<div class="rp rp-ext"><div class="rp-foot" style="margin:0">' + unnamed + ' NCR' +
      (unnamed === 1 ? ' was' : 's were') + ' raised this month without a company recorded against ' +
      'them, so ' + (unnamed === 1 ? 'it is' : 'they are') + ' not on any of the pages above.</div></div>'
    : '');
}

function renderList(rs){
  const term = view.search.trim().toLowerCase();
  let list = view.showClosed ? rs.slice() : rs.filter(isLive);

  if (term){
    list = list.filter(r =>
      (r.ref || '').toLowerCase().includes(term) ||
      (r.order || '').toLowerCase().includes(term) ||
      (r.cust || '').toLowerCase().includes(term) ||
      (r.what || '').toLowerCase().includes(term));
    /* refs that start with the term float to the top */
    list.sort((a,b) => {
      const as = (a.ref||'').toLowerCase().includes(term) ? 0 : 1;
      const bs = (b.ref||'').toLowerCase().includes(term) ? 0 : 1;
      return as - bs || (a.ref < b.ref ? 1 : -1);
    });
  } else {
    /* stale first, then open, then in progress, newest first within each */
    const rank = r => isStale(r) ? 0 : r.status === 'Open' ? 1 : r.status === 'In Progress' ? 2 : 3;
    list.sort((a,b) => rank(a) - rank(b) || (a.ts < b.ts ? 1 : -1));
  }

  const wrap = document.getElementById('listWrap');
  if (!list.length){
    wrap.innerHTML = '<div class="state"><strong>' + (term ? 'No NCRs match "' + esc(view.search) + '"' : 'Nothing outstanding') + '</strong>' +
      (term ? 'Try just the number, e.g. <code>176</code>.' : 'No outstanding NCRs in this department. Tick "Show closed" to see history.') + '</div>';
    return;
  }

  wrap.innerHTML =
    '<p class="count-line">' + list.length + ' NCR' + (list.length === 1 ? '' : 's') + (view.showClosed ? ' (incl. closed)' : ' outstanding') + '</p>' +
    '<div class="ncr-list">' + list.map(card).join('') + '</div>';
  attachCardClicks();
}

/* ---------------- unsaved notes ----------------
   Everything typed into the panel is kept in this browser as it is typed, so a
   dropped connection, a locked phone or a mis-tap cannot take it away. It is
   cleared the moment the NCR saves to the register. */
const FIELD_IDS = ['status','sev','owner','target','root','contain','corrective','verified','notes'];

function draftKey(ref){ return 'ncr-draft-' + ref; }
function readDraft(ref){
  try { const raw = localStorage.getItem(draftKey(ref)); return raw ? JSON.parse(raw) : null; }
  catch (err){ return null; }                     /* private window, or storage blocked */
}
function writeDraft(ref, fields){
  try { localStorage.setItem(draftKey(ref), JSON.stringify({ at: Date.now(), fields: fields })); }
  catch (err){ /* the panel still works, there is just no safety net */ }
}
function clearDraft(ref){ try { localStorage.removeItem(draftKey(ref)); } catch (err){} }

function panelValues(ov){
  const out = {};
  FIELD_IDS.forEach(k => { const el = ov.querySelector('#f_' + k); if (el) out[k] = el.value; });
  return out;
}
function applyValues(ov, fields){
  FIELD_IDS.forEach(k => { const el = ov.querySelector('#f_' + k); if (el && k in fields) el.value = fields[k]; });
}

/* ---------------- detail panel + save ---------------- */
function attachCardClicks(){
  document.querySelectorAll('.ncr[data-ref]').forEach(el =>
    el.addEventListener('click', () => {
      const r = DATA.rows.find(x => x.ref === el.dataset.ref);
      if (r) openDetail(r);
    }));
}

function sel(name, options, current){
  return '<select id="f_' + name + '">' + ['',...options].map(o =>
    '<option value="' + esc(o) + '"' + (o === current ? ' selected' : '') + '>' +
    (o ? esc(statusLabel(o)) : '&mdash;') + '</option>').join('') + '</select>';
}
function txt(name, val){ return '<input type="text" id="f_' + name + '" value="' + esc(val || '') + '">'; }
function area(name, val){ return '<textarea id="f_' + name + '">' + esc(val || '') + '</textarea>'; }

function openDetail(r){
  const ov = document.createElement('div');
  ov.className = 'overlay';
  const targetVal = r.target && !isNaN(new Date(r.target)) ? new Date(r.target).toISOString().slice(0,10) : '';
  ov.innerHTML =
    '<div class="panel" role="dialog" aria-modal="true" aria-label="' + esc(r.ref) + '">' +
      '<div class="panel-top"><span class="ref-chip">' + esc(r.ref) + '</span>' +
        '<span class="sev ' + esc(r.sev) + '">' + esc(r.sev || '') + '</span>' +
        '<button class="panel-close" type="button" aria-label="Close">&times;</button></div>' +
      '<div class="panel-what">' + esc(r.what) + '</div>' +
      '<div class="panel-meta">' +
        '<span>Raised ' + fmtDate(r.ts) + ' &middot; ' + daysSince(r.ts) + 'd old</span>' +
        (r.email ? '<a class="raised-by" href="mailto:' + r.email.replace(/[^\w.@+-]/g, '') + '">' +
          esc(r.email) + '</a>' : '') +
      '</div>' +
      '<dl class="detail-rows">' +
        (r.cat ? '<dt>Issue category</dt><dd>' + esc(r.cat) + '</dd>' : '') +
        (r.cust ? '<dt>Customer / Supplier</dt><dd>' + esc(r.cust) + '</dd>' : '') +
        (r.order ? '<dt>Order number</dt><dd>' + esc(r.order) + '</dd>' : '') +
        (r.suspected ? '<dt>Suspected cause</dt><dd>' + esc(r.suspected) + '</dd>' : '') +
        (r.immediate ? '<dt>Immediate action taken</dt><dd>' + esc(r.immediate) + '</dd>' : '') +
      '</dl>' +
      photoSection(r) +
      '<p class="req-note">Moving to In Progress needs a Severity and a target complete date. Closing needs every field below filled in.</p>' +
      '<div class="form-grid">' +
        '<div class="field"><label>Status</label>' + sel('status', ['Open','In Progress','Closed'], r.status) + '</div>' +
        '<div class="field" data-req><label>Severity</label>' + sel('sev', ['Critical','Major','Minor'], r.sev) + '</div>' +
        '<div class="field" data-req><label>Owner</label>' + txt('owner', r.owner) + '</div>' +
        '<div class="field" data-req><label>Target complete date</label><input type="date" id="f_target" value="' + targetVal + '"></div>' +
        '<div class="field wide" data-req><label>Root cause</label>' + area('root', r.root) + '</div>' +
        '<div class="field wide" data-req><label>Containment action</label>' + area('contain', r.contain) + '</div>' +
        '<div class="field wide" data-req><label>Corrective action</label>' + area('corrective', r.corrective) + '</div>' +
        '<div class="field" data-req><label>Verified by</label>' + txt('verified', r.verified) + '</div>' +
        '<div class="field wide" data-req><label>Resolution notes</label>' + area('notes', r.notes) + '</div>' +
      '</div>' +
      '<div class="draft-note" id="draftNote" hidden></div>' +
      '<div class="panel-actions">' +
        '<span class="save-msg" id="saveMsg"></span>' +
        '<button class="btn btn-cancel" type="button">Close</button>' +
        '<button class="btn btn-save" type="button" id="saveBtn">Save to register</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(ov);
  const original = {
    status: r.status || '', sev: r.sev || '', owner: r.owner || '', target: targetVal,
    root: r.root || '', contain: r.contain || '', corrective: r.corrective || '',
    verified: r.verified || '', notes: r.notes || ''
  };
  const changed = () => JSON.stringify(panelValues(ov)) !== JSON.stringify(original);

  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  /* Nothing shuts this window by accident — a half-written root cause is too
     easy to lose. Clicking the background does nothing at all. */
  const tryClose = () => {
    if (changed() && !window.confirm('You have changes that haven\u2019t been saved to the register.\n\n' +
        'Close anyway? Your notes are kept on this device and will be waiting when you next open ' +
        (r.ref || 'this NCR') + '.')) return;
    close();
  };
  const onKey = e => { if (e.key === 'Escape' && !document.querySelector('.lightbox')) tryClose(); };
  ov.querySelector('.panel-close').addEventListener('click', tryClose);
  ov.querySelector('.btn-cancel').addEventListener('click', tryClose);
  document.addEventListener('keydown', onKey);

  /* ---- put back anything typed but never saved ---- */
  const note = ov.querySelector('#draftNote');
  const draft = readDraft(r.ref);
  if (draft && draft.fields && JSON.stringify(draft.fields) !== JSON.stringify(original)){
    applyValues(ov, draft.fields);
    note.hidden = false;
    note.innerHTML = 'Notes you typed on ' +
      new Date(draft.at).toLocaleString('en-GB', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) +
      ' have been put back. They are not in the register until you save. ' +
      '<button type="button" id="dropDraft">Discard them</button>';
    note.querySelector('#dropDraft').addEventListener('click', () => {
      clearDraft(r.ref);
      applyValues(ov, original);
      note.hidden = true;
    });
  }

  /* ---- and keep it that way as they type ---- */
  let pending = null;
  const remember = () => {
    clearTimeout(pending);
    pending = setTimeout(() => {
      if (changed()) writeDraft(r.ref, panelValues(ov)); else clearDraft(r.ref);
    }, 400);
  };
  FIELD_IDS.forEach(k => {
    const el = ov.querySelector('#f_' + k);
    if (el){ el.addEventListener('input', remember); el.addEventListener('change', remember); }
  });

  loadPhotos(ov, r);

  ov.querySelector('#saveBtn').addEventListener('click', async () => {
    const btn = ov.querySelector('#saveBtn');
    const msg = ov.querySelector('#saveMsg');
    const val = id => { const el = ov.querySelector('#f_' + id); return el ? el.value.trim() : ''; };

    // ---- Mandatory checks: In Progress needs Severity; Closed needs everything ----
    ov.querySelectorAll('.field.invalid').forEach(f => f.classList.remove('invalid'));
    const chosen = val('status');
    let needed = [];
    if (chosen === 'In Progress') needed = ['sev', 'target'];
    if (chosen === 'Closed') needed = ['sev','owner','target','root','contain','corrective','verified','notes'];
    const missing = needed.filter(k => val(k) === '');
    if (missing.length){
      missing.forEach(k => { const el = ov.querySelector('#f_' + k); if (el) el.closest('.field').classList.add('invalid'); });
      msg.textContent = chosen === 'Closed'
        ? 'Fill in the highlighted fields to close this NCR'
        : 'Set a Severity and a target complete date before moving to In Progress';
      msg.className = 'save-msg err';
      const first = ov.querySelector('.field.invalid input, .field.invalid select, .field.invalid textarea');
      if (first) first.focus();
      return;
    }

    const updates = {};
    ['status','sev','owner','root','contain','corrective','target','verified','notes']
      .forEach(k => { const v = val(k); if (v !== '') updates[k] = v; });

    btn.disabled = true; msg.textContent = 'Saving\u2026'; msg.className = 'save-msg';
    try {
      const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ key: APP_KEY, ref: r.ref, row: r.row, updates }) });
      const out = await res.json();
      if (!out.ok) throw new Error(out.error || 'Save failed');
      clearDraft(r.ref);
      close();
      toast(r.ref + ' saved to the register');
      load();
    } catch (err) {
      btn.disabled = false;
      writeDraft(r.ref, panelValues(ov));
      msg.textContent = 'Couldn\u2019t save: ' + err.message + ' \u2014 your notes are kept, try again';
      msg.className = 'save-msg err';
    }
  });
}

/* ---------------- photos from the NCR form (register column L) ---------------- */
/* The uploads stay private in Drive — the Apps Script reads them as the sheet
   owner and hands the image back, so nothing has to be re-shared. */
const PHOTO_CACHE = {};

function photosOf(r){ return (r && Array.isArray(r.photos)) ? r.photos : []; }

function photoApiUrl(id){
  return API_URL + (API_URL.includes('?') ? '&' : '?') +
    'photo=' + encodeURIComponent(id) + '&key=' + encodeURIComponent(APP_KEY);
}
function driveViewUrl(id){ return 'https://drive.google.com/file/d/' + encodeURIComponent(id) + '/view'; }

function photoSection(r){
  const ps = photosOf(r);
  if (!ps.length) return '';
  return '<div class="photos-block">' +
      '<div class="photos-head">Photo' + (ps.length === 1 ? '' : 's') + ' linked to NCR</div>' +
      '<div class="photos">' +
        ps.map((p, i) =>
          '<figure class="photo" data-i="' + i + '">' +
            '<div class="photo-frame"><span class="photo-state">Loading&hellip;</span></div>' +
            '<figcaption class="photo-cap"></figcaption>' +
          '</figure>').join('') +
      '</div>' +
    '</div>';
}

async function fetchPhoto(id){
  if (PHOTO_CACHE[id]) return PHOTO_CACHE[id];
  const res = await fetch(photoApiUrl(id));
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const out = await res.json();
  if (!out.ok || !out.dataUri) throw new Error(out.error || 'Photo unavailable');
  PHOTO_CACHE[id] = out;
  return out;
}

/* One at a time — most NCRs have a single photo and it keeps the script happy. */
async function loadPhotos(ov, r){
  const ps = photosOf(r);
  for (let i = 0; i < ps.length; i++){
    const fig = ov.querySelector('.photo[data-i="' + i + '"]');
    if (!fig) continue;
    const p = ps[i];
    try {
      const shot = p.url ? { dataUri: p.url, name: '' } : await fetchPhoto(p.id);
      if (!fig.isConnected) return;                       /* panel closed while loading */
      showPhoto(fig, shot, i, ps.length);
    } catch (err){
      if (!fig.isConnected) return;
      showPhotoProblem(fig, p, err.message);
    }
  }
}

function showPhoto(fig, shot, i, total){
  const label = 'Photo ' + (i + 1) + (total > 1 ? ' of ' + total : '');
  const frame = fig.querySelector('.photo-frame');
  const img = document.createElement('img');
  img.alt = label;
  img.src = shot.dataUri;
  img.addEventListener('click', () => openLightbox(shot.dataUri, label));
  frame.innerHTML = '';
  frame.appendChild(img);
  fig.querySelector('.photo-cap').textContent = shot.name || label;
}

function showPhotoProblem(fig, p, why){
  const state = fig.querySelector('.photo-state');
  state.textContent = why || 'Photo unavailable';
  const href = p.url || (p.id ? driveViewUrl(p.id) : '');
  if (!href) return;
  const a = document.createElement('a');
  a.href = href; a.target = '_blank'; a.rel = 'noopener';
  a.textContent = 'Open the file \u2192';
  state.appendChild(document.createElement('br'));
  state.appendChild(a);
}

function openLightbox(src, label){
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  const btn = document.createElement('button');
  btn.className = 'lightbox-close'; btn.type = 'button';
  btn.setAttribute('aria-label', 'Close'); btn.innerHTML = '&times;';
  const img = document.createElement('img');
  img.alt = label; img.src = src;
  lb.appendChild(btn); lb.appendChild(img);
  const onKey = e => { if (e.key === 'Escape') shut(); };
  const shut = () => { lb.remove(); document.removeEventListener('keydown', onKey); };
  lb.addEventListener('click', shut);
  document.addEventListener('keydown', onKey);
  document.body.appendChild(lb);
}

function toast(text){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

load();
setInterval(backgroundRefresh, 5 * 60 * 1000);  // auto-refresh every 5 min
</script>
