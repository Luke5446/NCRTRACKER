<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tibard NCR Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Brand colours, taken from the fabric swatch in the Tibard logo */
  --ink:#1F3864;         /* Tibard navy — same navy as the sheet dashboard */
  --chambray:#2E6DA4;    /* swatch blue */
  --sky:#7FA9CE;         /* swatch light blue */
  --brand-green:#2F7A44; /* swatch green */
  --brand-red:#C1352C;   /* swatch red */
  --paper:#F4F6F9;       /* cool paper background */
  --card:#FFFFFF;
  --line:#DCE3EC;
  --muted:#5C6B7F;
  --open:#D9822B;        /* amber — open */
  --prog:#2E6DA4;        /* blue — in progress */
  --closed:#2F7A44;      /* green — closed */
  --flag:#C1352C;        /* red — not actioned */
  --tagbg:#EDF2F8;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
a{color:var(--chambray)}
:focus-visible{outline:3px solid var(--chambray);outline-offset:2px;border-radius:4px}

/* ---------- header ---------- */
header{background:var(--card);color:var(--ink);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:38px;width:auto;display:block}
/* shown only if the logo file is missing, so the header is never blank */
.wordmark{font-family:'Archivo',sans-serif;font-weight:800;font-size:1.2rem;letter-spacing:.14em;text-transform:uppercase}
.brand .sub{font-family:'Archivo',sans-serif;font-weight:700;font-size:.82rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);border-left:1px solid var(--line);padding-left:14px}
.head-meta{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:.8rem;color:var(--muted)}
.refresh-btn{border:1px solid var(--line);color:var(--ink);padding:6px 13px;border-radius:6px;font-size:.8rem;font-weight:600;background:var(--card)}
.refresh-btn:hover{background:var(--tagbg);border-color:var(--chambray)}

/* brand stripe — the colours of the swatch in the logo */
.seam{height:4px;margin:0;background:linear-gradient(to right,
  var(--brand-green) 0 25%, var(--brand-red) 25% 50%, var(--ink) 50% 75%, var(--sky) 75% 100%)}

main{max-width:1060px;margin:0 auto;padding:22px 18px 60px}

/* ---------- states ---------- */
.state{padding:60px 20px;text-align:center;color:var(--muted);font-size:.95rem}
.state strong{display:block;color:var(--ink);font-family:'Archivo',sans-serif;font-size:1.05rem;margin-bottom:8px}
.state code{background:#E6EAEF;padding:2px 6px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:.85em}

/* ---------- overview ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--chambray);border-radius:10px;padding:13px 16px;text-align:left;width:100%}
.kpi .num{font-family:'Archivo',sans-serif;font-weight:800;font-size:1.9rem;line-height:1.1}
.kpi .lbl{font-size:.74rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.kpi.flagged{border:1px solid #E7B3AE;border-top:3px solid var(--flag);background:#FDF4F3}
.kpi.flagged .num,.kpi.flagged .lbl{color:var(--flag)}
/* tiles you can open for a department breakdown */
.kpi-btn{cursor:pointer;transition:transform .12s ease, box-shadow .12s ease}
.kpi-btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(31,56,100,.10)}
.kpi-btn .lbl::after{content:" \25BE";font-size:.9em}
.kpi-btn.on{box-shadow:0 6px 16px rgba(31,56,100,.14)}
.kpi-btn.on .lbl::after{content:" \25B4"}

/* department breakdown opened from a tile */
.breakdown{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:26px}
.breakdown h3{font-family:'Archivo',sans-serif;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;color:var(--ink)}
.breakdown table{width:100%;border-collapse:collapse;font-size:.9rem}
.breakdown th,.breakdown td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
.breakdown th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.breakdown td:last-child,.breakdown th:last-child{text-align:right;font-variant-numeric:tabular-nums}
.breakdown tr.total td{font-weight:800;border-bottom:none;border-top:2px solid var(--ink)}
.breakdown .none{font-size:.88rem;color:var(--muted)}

.section-title{font-family:'Archivo',sans-serif;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink);margin:0 0 12px}

.dept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
/* department card styled as a garment swing-tag: punched hole + stitched top seam */
.dept-card{position:relative;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--chambray);border-radius:10px;padding:16px 16px 14px;text-align:left;width:100%;transition:transform .12s ease, box-shadow .12s ease}
.dept-card::before{content:"";position:absolute;top:10px;right:12px;width:10px;height:10px;border:2px solid var(--line);border-radius:50%;background:var(--paper)}
.dept-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(31,56,100,.12)}
.dept-name{font-family:'Archivo',sans-serif;font-weight:700;font-size:1.02rem;padding-right:22px;color:var(--ink)}
.dept-owner{font-size:.76rem;color:var(--muted);margin:2px 0 12px}
.dept-stats{display:flex;gap:16px;align-items:baseline}
.dept-stats .big{font-family:'Archivo',sans-serif;font-weight:800;font-size:1.7rem}
.dept-stats .small{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.badge-stale{display:inline-block;margin-top:10px;background:#FBEAE8;color:var(--flag);border:1px solid #E9BDB8;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px}
.badge-clear{display:inline-block;margin-top:10px;color:var(--closed);font-size:.75rem;font-weight:600}

/* ---------- department view ---------- */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.85rem;color:var(--chambray);margin-bottom:14px}
.dept-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.dept-head h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:1.5rem;color:var(--ink)}
.dept-head .owner{color:var(--muted);font-size:.85rem}

.searchbar{display:flex;gap:10px;margin:18px 0 14px;flex-wrap:wrap;align-items:center}
.main-search{margin:0 0 16px}
.main-search input{font-size:1rem;padding:13px 16px}
.dept-tag{background:var(--tagbg);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-weight:600;color:var(--ink)}
.searchbar input{flex:1;min-width:220px;padding:11px 14px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:.95rem;background:var(--card)}
.searchbar input::placeholder{color:#98A2AD}
.toggle{font-size:.8rem;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;user-select:none;cursor:pointer}
.toggle input{accent-color:var(--chambray);width:16px;height:16px;cursor:pointer}

/* ---------- NCR list ---------- */
.ncr-list{display:flex;flex-direction:column;gap:10px}
.ncr{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:start}
.ncr.stale{border-left:4px solid var(--flag)}
.ncr{border-left:4px solid transparent}
.ref-chip{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:.82rem;background:var(--tagbg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;white-space:nowrap}
.ncr-mid{min-width:0}
.ncr-what{font-size:.9rem;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ncr-meta{margin-top:5px;font-size:.75rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.ncr-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{font-size:.71rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.open{background:#FBF0E2;color:#9A5A17;border:1px solid #EBCDA5}
.pill.prog{background:#E8EEF4;color:var(--prog);border:1px solid #C4D2DE}
.pill.closed{background:#E8F1EA;color:var(--closed);border:1px solid #C0D8C6}
.pill.stale{background:#FBEAE8;color:var(--flag);border:1px solid #E9BDB8}
.sev{font-size:.72rem;font-weight:600;color:var(--muted)}
.sev::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--muted)}
.sev.Critical::before{background:var(--flag)} .sev.Critical{color:var(--flag)}
.sev.Major::before{background:var(--open)}
.sev.Minor::before{background:var(--closed)}
.count-line{font-size:.8rem;color:var(--muted);margin:2px 0 12px}

footer{max-width:1060px;margin:0 auto;padding:0 18px 30px;font-size:.72rem;color:#98A2AD}


/* ---------- detail / complete panel ---------- */
.detail-rows{background:var(--tagbg);border:1px solid var(--line);border-left:3px solid var(--chambray);border-radius:8px;padding:11px 13px;margin:10px 0 16px;display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:.85rem}
.detail-rows dt{font-weight:800;color:var(--ink);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;padding-top:2px;white-space:nowrap}
.detail-rows dd{margin:0;line-height:1.4;white-space:pre-line}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--flag);background:#FDF3F2}
.field.invalid label{color:var(--flag)}
.req-note{font-size:.75rem;color:var(--muted);margin:2px 0 10px}

/* ---------- photos from the NCR form ---------- */
.photos-block{margin:0 0 16px}
.photos-head{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:10px}
.photo{margin:0;min-width:0}
.photo-frame{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--tagbg);overflow:hidden;min-height:112px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.photo-frame img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.photo-state{font-size:.74rem;color:var(--muted);padding:10px;text-align:center;line-height:1.4}
.photo-state a{font-weight:600;display:inline-block;margin-top:4px}
.photo-cap{font-size:.7rem;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.has-photo{color:var(--chambray);font-weight:600}
.lightbox{position:fixed;inset:0;background:rgba(30,42,58,.88);display:flex;align-items:center;justify-content:center;padding:22px;z-index:70;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.lightbox-close{position:absolute;top:12px;right:16px;color:#fff;font-size:2rem;line-height:1;padding:2px 10px}
.overlay{position:fixed;inset:0;background:rgba(30,42,58,.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;z-index:50;overflow-y:auto}
.panel{background:var(--card);border-radius:12px;max-width:640px;width:100%;padding:20px 22px;box-shadow:0 18px 50px rgba(30,42,58,.3)}
.panel-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.panel-top .ref-chip{font-size:.95rem}
.panel{border-top:4px solid var(--chambray)}
.panel-close{margin-left:auto;font-size:1.5rem;line-height:1;color:var(--muted);padding:4px 8px}
.panel-what{font-size:.95rem;line-height:1.5;margin:6px 0 4px;white-space:pre-line;font-weight:700}
.panel-meta{font-size:.78rem;color:var(--muted);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:4px 14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field.wide{grid-column:1 / -1}
.field label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;font-size:.9rem;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:#FBFCFD;width:100%}
.field textarea{resize:vertical;min-height:64px}
.panel-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;align-items:center}
.btn{font-weight:700;font-size:.88rem;padding:10px 18px;border-radius:8px}
.btn-save{background:var(--ink);color:#fff}
.btn-save:disabled{opacity:.55;cursor:default}
.btn-cancel{color:var(--muted)}
.save-msg{font-size:.8rem;font-weight:600;margin-right:auto}
.save-msg.ok{color:var(--closed)}
.save-msg.err{color:var(--flag)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:.85rem;font-weight:600;padding:11px 18px;border-radius:8px;box-shadow:0 8px 24px rgba(30,42,58,.35);z-index:60}
@media (max-width:560px){ .form-grid{grid-template-columns:1fr} }

@media (max-width:560px){
  header{padding:10px 14px;gap:10px}
  .brand img{height:30px}
  .brand .sub{font-size:.7rem;padding-left:10px;letter-spacing:.06em;white-space:nowrap}
  .ncr{grid-template-columns:1fr}
  .ncr-side{flex-direction:row;align-items:center;justify-content:flex-start}
  .head-meta{width:100%;margin-left:0}
}
@media (prefers-reduced-motion: reduce){
  .dept-card{transition:none}
  .dept-card:hover{transform:none}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="tibard-logo.jpg" alt="Tibard" onerror="this.outerHTML='&lt;span class=&quot;wordmark&quot;&gt;Tibard&lt;/span&gt;'">
    <span class="sub">NCR Dashboard</span>
  </div>
  <div class="head-meta">
    <span id="updated"></span>
    <button class="refresh-btn" id="refreshBtn" type="button">Refresh</button>
  </div>
</header>
<div class="seam"></div>

<main id="app">
  <div class="state"><strong>Loading the register&hellip;</strong>Fetching live NCRs from the Google Sheet.</div>
</main>

<footer>Live from the NCR register. Tap any NCR to see the full report and complete it &mdash; everything saves straight back to the register.</footer>

<script>
/* ================= CONFIG ================= */
const API_URL = "https://script.google.com/macros/s/AKfycbyfpl9AnvGr5zv-Vimh04no7LhYD2RV6ZZMlyan2BQhWPHLqKZlbjDB0x0y-Y9qLfw5/exec";
const APP_KEY = "tibard-ncr-2026";   // must match APP_KEY in the Apps Script
const STALE_DAYS = 7;                    // flag if still "Open" after this many days
const NEW_WINDOW_DAYS = 7;               // "new" = raised in the last 7 days
const OWNERS = {
  "Sales":"Duncan", "Suppliers & DPD":"Duncan", "IT & Digital":"Ben",
  "Production":"Gail", "EMB":"Sharon", "Stores":"Ste",
  "Accounts":"Vanessa", "ISO/QC":"Yvonne", "Procurement":"Duncan", "Other":"Luke H"
};
/* Suppliers + DPD reviewed as one, matching the monthly meeting */
function groupDept(d){ return (d === "Suppliers" || d === "DPD") ? "Suppliers & DPD" : (d || "Other"); }
/* Staff read "Open" as "someone is on it", so the app says Outstanding.
   The value written to the register is still "Open" — this is wording only. */
const STATUS_LABEL = { "Open": "Outstanding" };
function statusLabel(v){ return STATUS_LABEL[v] || v; }
/* ========================================== */

let DATA = null;
let view = { dept: null, search: "", showClosed: false, metric: null, q: "" };

const $app = document.getElementById('app');
const $updated = document.getElementById('updated');
document.getElementById('refreshBtn').addEventListener('click', () => load(true));

function daysSince(iso){
  const t = new Date(iso); if (isNaN(t)) return 0;
  return Math.floor((Date.now() - t.getTime()) / 86400000);
}
function isLive(r){ return r.status === "Open" || r.status === "In Progress"; }
function isStale(r){ return r.status === "Open" && daysSince(r.ts) > STALE_DAYS; }
function isNew(r){ return daysSince(r.ts) <= NEW_WINDOW_DAYS; }
/* offset 0 = this calendar month, -1 = last calendar month */
function monthStart(offset){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth() + offset, 1); }
function inMonth(r, offset){
  const t = new Date(r.ts); if (isNaN(t)) return false;
  const m = monthStart(offset);
  return t.getFullYear() === m.getFullYear() && t.getMonth() === m.getMonth();
}
function monthName(offset){ return monthStart(offset).toLocaleDateString('en-GB', { month:'long' }); }
function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
function fmtDate(iso){
  const t = new Date(iso); if (isNaN(t)) return "";
  return t.toLocaleDateString('en-GB', { day:'numeric', month:'short' });
}
async function load(manual){
  if (manual) $app.innerHTML = '<div class="state"><strong>Refreshing&hellip;</strong></div>';
  if (API_URL.indexOf('PASTE_') === 0){
    $app.innerHTML = '<div class="state"><strong>Not connected yet</strong>Open this file and paste your Apps Script Web App URL into <code>API_URL</code> at the top of the script section.</div>';
    return;
  }
  try {
    const res = await fetch(API_URL + (API_URL.includes('?') ? '&' : '?') + 't=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    DATA = await res.json();
    $updated.textContent = 'Updated ' + new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
    render();
  } catch (err){
    $app.innerHTML = '<div class="state"><strong>Couldn\'t reach the register</strong>' +
      'Check you\'re online, then press Refresh. If it keeps failing, the Apps Script deployment may need redeploying.<br><br><code>' + esc(err.message) + '</code></div>';
  }
}

function render(){ view.dept ? renderDept() : renderOverview(); }

/* ---------------- overview ---------------- */
/* The four headline tiles. Tap one to see the same figure split by department. */
function metrics(){
  return {
    last: { label: 'NCRs in ' + monthName(-1), test: r => inMonth(r, -1) },
    this: { label: 'NCRs in ' + monthName(0),  test: r => inMonth(r, 0) },
    prog: { label: 'In progress',              test: r => r.status === 'In Progress' },
    late: { label: 'Not actioned in ' + STALE_DAYS + ' days', test: isStale, flag: true }
  };
}

function renderOverview(){
  $app.innerHTML =
    '<div class="searchbar main-search">' +
      '<input type="search" id="mainQ" autocomplete="off" value="' + esc(view.q) + '" ' +
        'placeholder="Search every NCR &mdash; number, order, customer or keyword&hellip;">' +
    '</div>' +
    '<div id="mainBody"></div>';

  const box = document.getElementById('mainQ');
  box.addEventListener('input', () => { view.q = box.value; renderMainBody(); });
  renderMainBody();
}

/* Either the search results, or the tiles and departments. */
function renderMainBody(){
  const wrap = document.getElementById('mainBody');
  if (!wrap) return;
  if (view.q.trim()){ renderSearch(wrap, view.q.trim()); return; }

  const rows = DATA.rows;
  const M = metrics();

  const groups = {};
  rows.forEach(r => {
    const g = groupDept(r.dept);
    (groups[g] = groups[g] || []).push(r);
  });

  /* alphabetical, so people can find their own department at a glance */
  const order = Object.keys(groups).sort((a,b) => a.localeCompare(b));

  let html =
    '<div class="kpis">' +
      Object.keys(M).map(k => {
        const m = M[k];
        return '<button type="button" class="kpi kpi-btn' + (m.flag ? ' flagged' : '') +
          (view.metric === k ? ' on' : '') + '" data-metric="' + k + '">' +
          '<div class="num">' + rows.filter(m.test).length + '</div>' +
          '<div class="lbl">' + esc(m.label) + '</div></button>';
      }).join('') +
    '</div>' +
    '<div id="breakdown"></div>' +
    '<h2 class="section-title">Departments &mdash; tap yours</h2>' +
    '<div class="dept-grid">';

  order.forEach(g => {
    const rs = groups[g];
    const nOpen = rs.filter(isLive).length;
    const nNew = rs.filter(isNew).length;
    const nStale = rs.filter(isStale).length;
    html +=
      '<button class="dept-card" type="button" data-dept="' + esc(g) + '">' +
        '<div class="dept-name">' + esc(g) + '</div>' +
        '<div class="dept-owner">' + esc(OWNERS[g] || '') + '</div>' +
        '<div class="dept-stats">' +
          '<span><span class="big">' + nNew + '</span> <span class="small">new</span></span>' +
          '<span><span class="big">' + nOpen + '</span> <span class="small">outstanding</span></span>' +
        '</div>' +
        (nStale > 0
          ? '<span class="badge-stale">' + nStale + ' not actioned in ' + STALE_DAYS + '+ days</span>'
          : '<span class="badge-clear">All actioned &#10003;</span>') +
      '</button>';
  });

  html += '</div>';
  wrap.innerHTML = html;
  wrap.querySelectorAll('.dept-card').forEach(b =>
    b.addEventListener('click', () => { view = { dept: b.dataset.dept, search: "", showClosed: false, metric: null, q: "" }; render(); window.scrollTo(0,0); }));
  wrap.querySelectorAll('.kpi-btn').forEach(b =>
    b.addEventListener('click', () => {
      view.metric = (view.metric === b.dataset.metric) ? null : b.dataset.metric;
      renderMainBody();
    }));
  renderBreakdown();
}

/* Front-page search: every NCR in the register, closed ones included, so a
   number can be looked up without knowing whose department it belongs to. */
function renderSearch(wrap, term){
  const t = term.toLowerCase();
  const hit = v => String(v || '').toLowerCase().includes(t);
  const list = DATA.rows.filter(r => hit(r.ref) || hit(r.order) || hit(r.cust) || hit(r.dept) || hit(r.what));

  /* a matching NCR number is almost always what was wanted, so float those up */
  list.sort((a,b) => {
    const rank = r => hit(r.ref) ? 0 : 1;
    return rank(a) - rank(b) || (a.ts < b.ts ? 1 : -1);
  });

  if (!list.length){
    wrap.innerHTML = '<div class="state"><strong>No NCRs match &ldquo;' + esc(term) + '&rdquo;</strong>' +
      'Try just the number, e.g. <code>176</code>, or an order number.</div>';
    return;
  }

  wrap.innerHTML =
    '<p class="count-line">' + list.length + ' NCR' + (list.length === 1 ? '' : 's') +
      ' found &mdash; all departments, including closed</p>' +
    '<div class="ncr-list">' + list.map(r => card(r, true)).join('') + '</div>';
  attachCardClicks();
}

/* The department split behind whichever tile is open. */
function renderBreakdown(){
  const wrap = document.getElementById('breakdown');
  if (!wrap) return;
  const m = metrics()[view.metric];
  if (!m){ wrap.innerHTML = ''; return; }

  const matching = DATA.rows.filter(m.test);
  const counts = {};
  matching.forEach(r => { const g = groupDept(r.dept); counts[g] = (counts[g] || 0) + 1; });
  const order = Object.keys(counts).sort((a,b) => counts[b] - counts[a] || (a < b ? -1 : 1));

  wrap.innerHTML = '<div class="breakdown"><h3>' + esc(m.label) + ' &mdash; by department</h3>' +
    (order.length
      ? '<table><thead><tr><th>Department</th><th>NCRs</th></tr></thead><tbody>' +
        order.map(g => '<tr><td>' + esc(g) + '</td><td>' + counts[g] + '</td></tr>').join('') +
        '<tr class="total"><td>Total</td><td>' + matching.length + '</td></tr>' +
        '</tbody></table>'
      : '<p class="none">Nothing to show.</p>') +
    '</div>';
}

function kpi(n, label, flagged){
  return '<div class="kpi' + (flagged ? ' flagged' : '') + '"><div class="num">' + n + '</div><div class="lbl">' + label + '</div></div>';
}

/* ---------------- department view ---------------- */
function renderDept(){
  const g = view.dept;
  const rs = DATA.rows.filter(r => groupDept(r.dept) === g);
  const live = rs.filter(isLive);
  const stale = rs.filter(isStale);
  const openOnly = rs.filter(r => r.status === 'Open');
  const prog = rs.filter(r => r.status === 'In Progress');

  let html =
    '<button class="back" type="button" id="backBtn">&larr; All departments</button>' +
    '<div class="dept-head"><h1>' + esc(g) + '</h1><span class="owner">Owner: ' + esc(OWNERS[g] || '&mdash;') + '</span></div>' +
    '<div class="kpis">' +
      kpi(openOnly.length, 'Outstanding') +
      kpi(prog.length, 'In progress') +
      kpi(stale.length, 'Not actioned in ' + STALE_DAYS + ' days', true) +
    '</div>' +
    '<div class="searchbar">' +
      '<input type="search" id="q" placeholder="Search by NCR number, order, customer or keyword&hellip;" value="' + esc(view.search) + '" autocomplete="off">' +
      '<label class="toggle"><input type="checkbox" id="showClosed"' + (view.showClosed ? ' checked' : '') + '> Show closed</label>' +
    '</div>' +
    '<div id="listWrap"></div>';

  $app.innerHTML = html;
  document.getElementById('backBtn').addEventListener('click', () => { view.dept = null; view.metric = null; render(); });
  const q = document.getElementById('q');
  q.addEventListener('input', () => { view.search = q.value; renderList(rs); });
  document.getElementById('showClosed').addEventListener('change', e => { view.showClosed = e.target.checked; renderList(rs); });
  renderList(rs);
}

function renderList(rs){
  const term = view.search.trim().toLowerCase();
  let list = view.showClosed ? rs.slice() : rs.filter(isLive);

  if (term){
    list = list.filter(r =>
      (r.ref || '').toLowerCase().includes(term) ||
      (r.order || '').toLowerCase().includes(term) ||
      (r.cust || '').toLowerCase().includes(term) ||
      (r.what || '').toLowerCase().includes(term));
    /* refs that start with the term float to the top */
    list.sort((a,b) => {
      const as = (a.ref||'').toLowerCase().includes(term) ? 0 : 1;
      const bs = (b.ref||'').toLowerCase().includes(term) ? 0 : 1;
      return as - bs || (a.ref < b.ref ? 1 : -1);
    });
  } else {
    /* stale first, then open, then in progress, newest first within each */
    const rank = r => isStale(r) ? 0 : r.status === 'Open' ? 1 : r.status === 'In Progress' ? 2 : 3;
    list.sort((a,b) => rank(a) - rank(b) || (a.ts < b.ts ? 1 : -1));
  }

  const wrap = document.getElementById('listWrap');
  if (!list.length){
    wrap.innerHTML = '<div class="state"><strong>' + (term ? 'No NCRs match "' + esc(view.search) + '"' : 'Nothing outstanding') + '</strong>' +
      (term ? 'Try just the number, e.g. <code>176</code>.' : 'No outstanding NCRs in this department. Tick "Show closed" to see history.') + '</div>';
    return;
  }

  wrap.innerHTML =
    '<p class="count-line">' + list.length + ' NCR' + (list.length === 1 ? '' : 's') + (view.showClosed ? ' (incl. closed)' : ' outstanding') + '</p>' +
    '<div class="ncr-list">' + list.map(card).join('') + '</div>';
  attachCardClicks();
}

function card(r, withDept){
  const stale = isStale(r);
  const age = daysSince(r.ts);
  const nPics = photosOf(r).length;
  const pill = r.status === 'Closed' ? '<span class="pill closed">Closed</span>'
             : r.status === 'In Progress' ? '<span class="pill prog">In progress</span>'
             : '<span class="pill open">Outstanding</span>';
  return '<button type="button" class="ncr' + (stale ? ' stale' : '') + '" data-ref="' + esc(r.ref) + '" style="text-align:left;width:100%">' +
    '<span class="ref-chip">' + esc(r.ref || '&mdash;') + '</span>' +
    '<div class="ncr-mid">' +
      '<div class="ncr-what">' + esc(r.what) + '</div>' +
      '<div class="ncr-meta">' +
        '<span>' + fmtDate(r.ts) + ' &middot; ' + age + 'd old</span>' +
        (withDept && r.dept ? '<span class="dept-tag">' + esc(groupDept(r.dept)) + '</span>' : '') +
        (r.order ? '<span>Order ' + esc(r.order) + '</span>' : '') +
        (r.cust ? '<span>' + esc(r.cust) + '</span>' : '') +
        (r.sev ? '<span class="sev ' + esc(r.sev) + '">' + esc(r.sev) + '</span>' : '') +
        (nPics ? '<span class="has-photo">&#128247; ' + nPics + ' photo' + (nPics === 1 ? '' : 's') + '</span>' : '') +
      '</div>' +
    '</div>' +
    '<div class="ncr-side">' +
      (stale ? '<span class="pill stale">' + age + 'd &middot; not actioned</span>' : pill) +
    '</div>' +
  '</button>';
}

/* ---------------- detail panel + save ---------------- */
function attachCardClicks(){
  document.querySelectorAll('.ncr[data-ref]').forEach(el =>
    el.addEventListener('click', () => {
      const r = DATA.rows.find(x => x.ref === el.dataset.ref);
      if (r) openDetail(r);
    }));
}

function sel(name, options, current){
  return '<select id="f_' + name + '">' + ['',...options].map(o =>
    '<option value="' + esc(o) + '"' + (o === current ? ' selected' : '') + '>' +
    (o ? esc(statusLabel(o)) : '&mdash;') + '</option>').join('') + '</select>';
}
function txt(name, val){ return '<input type="text" id="f_' + name + '" value="' + esc(val || '') + '">'; }
function area(name, val){ return '<textarea id="f_' + name + '">' + esc(val || '') + '</textarea>'; }

function openDetail(r){
  const ov = document.createElement('div');
  ov.className = 'overlay';
  const targetVal = r.target && !isNaN(new Date(r.target)) ? new Date(r.target).toISOString().slice(0,10) : '';
  ov.innerHTML =
    '<div class="panel" role="dialog" aria-modal="true" aria-label="' + esc(r.ref) + '">' +
      '<div class="panel-top"><span class="ref-chip">' + esc(r.ref) + '</span>' +
        '<span class="sev ' + esc(r.sev) + '">' + esc(r.sev || '') + '</span>' +
        '<button class="panel-close" type="button" aria-label="Close">&times;</button></div>' +
      '<div class="panel-what">' + esc(r.what) + '</div>' +
      '<div class="panel-meta">' +
        '<span>Raised ' + fmtDate(r.ts) + ' &middot; ' + daysSince(r.ts) + 'd old</span>' +
      '</div>' +
      '<dl class="detail-rows">' +
        (r.cat ? '<dt>Issue category</dt><dd>' + esc(r.cat) + '</dd>' : '') +
        (r.cust ? '<dt>Customer / Supplier</dt><dd>' + esc(r.cust) + '</dd>' : '') +
        (r.order ? '<dt>Order number</dt><dd>' + esc(r.order) + '</dd>' : '') +
        (r.suspected ? '<dt>Suspected cause</dt><dd>' + esc(r.suspected) + '</dd>' : '') +
        (r.immediate ? '<dt>Immediate action taken</dt><dd>' + esc(r.immediate) + '</dd>' : '') +
      '</dl>' +
      photoSection(r) +
      '<p class="req-note">Moving to In Progress needs a Severity. Closing needs every field below filled in.</p>' +
      '<div class="form-grid">' +
        '<div class="field"><label>Status</label>' + sel('status', ['Open','In Progress','Closed'], r.status) + '</div>' +
        '<div class="field" data-req><label>Severity</label>' + sel('sev', ['Critical','Major','Minor'], r.sev) + '</div>' +
        '<div class="field" data-req><label>Owner</label>' + txt('owner', r.owner) + '</div>' +
        '<div class="field" data-req><label>Target complete date</label><input type="date" id="f_target" value="' + targetVal + '"></div>' +
        '<div class="field wide" data-req><label>Root cause</label>' + area('root', r.root) + '</div>' +
        '<div class="field wide" data-req><label>Containment action</label>' + area('contain', r.contain) + '</div>' +
        '<div class="field wide" data-req><label>Corrective action</label>' + area('corrective', r.corrective) + '</div>' +
        '<div class="field" data-req><label>Verified by</label>' + txt('verified', r.verified) + '</div>' +
        '<div class="field wide" data-req><label>Resolution notes</label>' + area('notes', r.notes) + '</div>' +
      '</div>' +
      '<div class="panel-actions">' +
        '<span class="save-msg" id="saveMsg"></span>' +
        '<button class="btn btn-cancel" type="button">Cancel</button>' +
        '<button class="btn btn-save" type="button" id="saveBtn">Save to register</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(ov);
  const onKey = e => { if (e.key === 'Escape' && !document.querySelector('.lightbox')) close(); };
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  ov.querySelector('.panel-close').addEventListener('click', close);
  ov.querySelector('.btn-cancel').addEventListener('click', close);
  document.addEventListener('keydown', onKey);
  loadPhotos(ov, r);

  ov.querySelector('#saveBtn').addEventListener('click', async () => {
    const btn = ov.querySelector('#saveBtn');
    const msg = ov.querySelector('#saveMsg');
    const val = id => { const el = ov.querySelector('#f_' + id); return el ? el.value.trim() : ''; };

    // ---- Mandatory checks: In Progress needs Severity; Closed needs everything ----
    ov.querySelectorAll('.field.invalid').forEach(f => f.classList.remove('invalid'));
    const chosen = val('status');
    let needed = [];
    if (chosen === 'In Progress') needed = ['sev'];
    if (chosen === 'Closed') needed = ['sev','owner','target','root','contain','corrective','verified','notes'];
    const missing = needed.filter(k => val(k) === '');
    if (missing.length){
      missing.forEach(k => { const el = ov.querySelector('#f_' + k); if (el) el.closest('.field').classList.add('invalid'); });
      msg.textContent = chosen === 'Closed'
        ? 'Fill in the highlighted fields to close this NCR'
        : 'Set a Severity before moving to In Progress';
      msg.className = 'save-msg err';
      const first = ov.querySelector('.field.invalid input, .field.invalid select, .field.invalid textarea');
      if (first) first.focus();
      return;
    }

    const updates = {};
    ['status','sev','owner','root','contain','corrective','target','verified','notes']
      .forEach(k => { const v = val(k); if (v !== '') updates[k] = v; });

    btn.disabled = true; msg.textContent = 'Saving\u2026'; msg.className = 'save-msg';
    try {
      const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ key: APP_KEY, ref: r.ref, row: r.row, updates }) });
      const out = await res.json();
      if (!out.ok) throw new Error(out.error || 'Save failed');
      close();
      toast(r.ref + ' saved to the register');
      load();
    } catch (err) {
      btn.disabled = false;
      msg.textContent = 'Couldn\u2019t save: ' + err.message;
      msg.className = 'save-msg err';
    }
  });
}

/* ---------------- photos from the NCR form (register column L) ---------------- */
/* The uploads stay private in Drive — the Apps Script reads them as the sheet
   owner and hands the image back, so nothing has to be re-shared. */
const PHOTO_CACHE = {};

function photosOf(r){ return (r && Array.isArray(r.photos)) ? r.photos : []; }

function photoApiUrl(id){
  return API_URL + (API_URL.includes('?') ? '&' : '?') +
    'photo=' + encodeURIComponent(id) + '&key=' + encodeURIComponent(APP_KEY);
}
function driveViewUrl(id){ return 'https://drive.google.com/file/d/' + encodeURIComponent(id) + '/view'; }

function photoSection(r){
  const ps = photosOf(r);
  if (!ps.length) return '';
  return '<div class="photos-block">' +
      '<div class="photos-head">Photo' + (ps.length === 1 ? '' : 's') + ' linked to NCR</div>' +
      '<div class="photos">' +
        ps.map((p, i) =>
          '<figure class="photo" data-i="' + i + '">' +
            '<div class="photo-frame"><span class="photo-state">Loading&hellip;</span></div>' +
            '<figcaption class="photo-cap"></figcaption>' +
          '</figure>').join('') +
      '</div>' +
    '</div>';
}

async function fetchPhoto(id){
  if (PHOTO_CACHE[id]) return PHOTO_CACHE[id];
  const res = await fetch(photoApiUrl(id));
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const out = await res.json();
  if (!out.ok || !out.dataUri) throw new Error(out.error || 'Photo unavailable');
  PHOTO_CACHE[id] = out;
  return out;
}

/* One at a time — most NCRs have a single photo and it keeps the script happy. */
async function loadPhotos(ov, r){
  const ps = photosOf(r);
  for (let i = 0; i < ps.length; i++){
    const fig = ov.querySelector('.photo[data-i="' + i + '"]');
    if (!fig) continue;
    const p = ps[i];
    try {
      const shot = p.url ? { dataUri: p.url, name: '' } : await fetchPhoto(p.id);
      if (!fig.isConnected) return;                       /* panel closed while loading */
      showPhoto(fig, shot, i, ps.length);
    } catch (err){
      if (!fig.isConnected) return;
      showPhotoProblem(fig, p, err.message);
    }
  }
}

function showPhoto(fig, shot, i, total){
  const label = 'Photo ' + (i + 1) + (total > 1 ? ' of ' + total : '');
  const frame = fig.querySelector('.photo-frame');
  const img = document.createElement('img');
  img.alt = label;
  img.src = shot.dataUri;
  img.addEventListener('click', () => openLightbox(shot.dataUri, label));
  frame.innerHTML = '';
  frame.appendChild(img);
  fig.querySelector('.photo-cap').textContent = shot.name || label;
}

function showPhotoProblem(fig, p, why){
  const state = fig.querySelector('.photo-state');
  state.textContent = why || 'Photo unavailable';
  const href = p.url || (p.id ? driveViewUrl(p.id) : '');
  if (!href) return;
  const a = document.createElement('a');
  a.href = href; a.target = '_blank'; a.rel = 'noopener';
  a.textContent = 'Open the file \u2192';
  state.appendChild(document.createElement('br'));
  state.appendChild(a);
}

function openLightbox(src, label){
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  const btn = document.createElement('button');
  btn.className = 'lightbox-close'; btn.type = 'button';
  btn.setAttribute('aria-label', 'Close'); btn.innerHTML = '&times;';
  const img = document.createElement('img');
  img.alt = label; img.src = src;
  lb.appendChild(btn); lb.appendChild(img);
  const onKey = e => { if (e.key === 'Escape') shut(); };
  const shut = () => { lb.remove(); document.removeEventListener('keydown', onKey); };
  lb.addEventListener('click', shut);
  document.addEventListener('keydown', onKey);
  document.body.appendChild(lb);
}

function toast(text){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

load();
setInterval(() => { if (DATA) load(); }, 5 * 60 * 1000);  // auto-refresh every 5 min
</script>
